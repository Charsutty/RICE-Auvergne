 # Counts and Crosiers — chaîne de Clermont approfondie
 auvergne.1002.t:0 "Un serment contre les guerres privées"
 auvergne.1002.desc:0 "Des gens d'Église pressent les principaux seigneurs du pays clermontois de jurer une paix publique : les églises ne doivent pas être saisies, les hommes sans armes ne doivent pas être dépouillés et les querelles ne doivent pas dévorer chaque route et chaque champ. Un tel serment renforcerait la médiation ecclésiastique. Mais si la paix doit lier mes terres, ma propre justice doit aussi y avoir sa place."
 auvergne.1002.a:0 "Que la paix soit proclamée depuis les églises."
 auvergne.1002.b:0 "La paix repose sur ma justice, non sur la leur."
 auvergne.1002.c:0 "Le serment portera la crosse comme mon sceau."
 auvergne.1002.info:0 "Contexte historique : l'Auvergne fut un espace important du mouvement de la Paix de Dieu à la fin du Xe et au XIe siècle. Des évêques et d'autres acteurs ecclésiastiques cherchèrent à limiter les violences aristocratiques et à protéger les églises ainsi que les groupes vulnérables. Cet événement représente ce contexte politico-religieux sans reconstituer une assemblée clermontoise précise."
