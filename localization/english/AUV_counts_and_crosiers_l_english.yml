l_english:
 # Counts and Crosiers — expanded Clermont chain
 auvergne.1002.t:0 "An Oath Against Private War"
 auvergne.1002.desc:0 "Churchmen urge the leading men of the Clermont country to swear a public peace: churches are not to be seized, the unarmed are not to be plundered, and feuds are not to consume every road and field. Such an oath would strengthen ecclesiastical mediation. Yet if peace is to bind my lands, my own justice must also have a place in it."
 auvergne.1002.a:0 "Let the peace be proclaimed from the churches."
 auvergne.1002.b:0 "Peace rests on my justice, not theirs."
 auvergne.1002.c:0 "The oath will stand under both crosier and seal."
 auvergne.1002.info:0 "Historical context: Auvergne was an important setting for the late tenth- and eleventh-century Peace of God movement, in which bishops and other ecclesiastical actors sought to restrain aristocratic violence and protect churches and vulnerable groups. This event represents that political-religious environment rather than recreating one documented Clermont assembly."
