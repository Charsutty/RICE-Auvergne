l_english:
 AUV_MOD_NAME:0 "RICE: Auvergne"
 AUV_MOD_DESC:0 "Regional flavor for medieval Auvergne and its connected highland worlds."

 # Decisions — Counts and Crosiers
 AUV_negotiate_clermont_authority_decision:0 "Negotiate Authority at Clermont"
 AUV_negotiate_clermont_authority_decision_desc:0 "Around Clermont, a count's command is never the only source of public authority. The Church possesses its own privileges, clients, lands, and claims to keep the peace. A settlement with the clergy could steady the county—or reveal whose word truly carries weight."
 AUV_has_available_court_chaplain_req:0 "You have an available [court_chaplain|E]"
 AUV_negotiate_clermont_authority_effect_tooltip:0 "You will choose how comital and ecclesiastical authority are balanced around Clermont for the next ten years."

 # Decisions — The Divided House
 AUV_address_comital_succession_decision:0 "Address the Comital Succession"
 AUV_address_comital_succession_decision_desc:0 "Claims within the comital house can be suppressed, reconciled, or recognized. What is recorded now may determine whether Auvergne remains under one line or becomes the inheritance of rival branches."
 AUV_address_comital_succession_effect_tooltip:0 "Your choice will establish a persistent dynasty state for the future Divided House chain; it will not create a title or cadet branch yet."

 # Decisions — Saints and Patrons
 AUV_patronize_auvergnat_institution_decision:0 "Patronize an Auvergnat Institution"
 AUV_patronize_auvergnat_institution_decision_desc:0 "The great churches and monasteries of Auvergne preserve charters, educate aristocratic clergy, pray for their benefactors, and connect local houses to wider religious networks. Sustained patronage can make one of these institutions a partner of my dynasty."
 AUV_patronize_auvergnat_institution_decision_tooltip:0 "Establish a ten-year patronage relationship with a documented Auvergnat religious institution."
 AUV_patronize_auvergnat_institution_effect_tooltip:0 "You will choose between Saint-Julien of Brioude and, after 1043, La Chaise-Dieu."

 # Decisions — Lords of the High Country
 AUV_secure_upper_allier_routes_decision:0 "Secure the Roads of the Upper Allier"
 AUV_secure_upper_allier_routes_decision_desc:0 "The high country between the Velay and Gévaudan is held together by difficult roads, river crossings, castles, and local rights. The corridor can be secured through direct investment, stricter tolls, or a negotiated compact."
 AUV_secure_upper_allier_routes_effect_tooltip:0 "You will choose how to govern the crossings, fortifications, and local rights of the Upper Allier for the next ten years."

 # Modifiers — Counts and Crosiers
 AUV_clermont_ecclesiastical_compact_modifier:0 "Compact with the Crosier"
 AUV_clermont_ecclesiastical_compact_modifier_desc:0 "This ruler has confirmed ecclesiastical privileges around Clermont and made the clergy partners in maintaining order."
 AUV_clermont_comital_ascendancy_modifier:0 "Comital Ascendancy at Clermont"
 AUV_clermont_comital_ascendancy_modifier_desc:0 "This ruler has asserted comital jurisdiction over competing ecclesiastical claims around Clermont."
 AUV_clermont_balanced_authority_modifier:0 "Balanced Authority at Clermont"
 AUV_clermont_balanced_authority_modifier_desc:0 "A written compromise has divided responsibilities between the ruler and the clergy without ending their rivalry."
 AUV_clermont_privileges_county_modifier:0 "Ecclesiastical Privileges Confirmed"
 AUV_clermont_privileges_county_modifier_desc:0 "Recognized church rights strengthen local cooperation, though some revenues remain beyond direct comital reach."
 AUV_clermont_jurisdiction_county_modifier:0 "Comital Jurisdiction Asserted"
 AUV_clermont_jurisdiction_county_modifier_desc:0 "Officials enforce a clearer comital claim to revenues and public order, provoking some local resistance."
 AUV_clermont_compromise_county_modifier:0 "Clermont Jurisdictional Compact"
 AUV_clermont_compromise_county_modifier_desc:0 "Comital officers and ecclesiastical representatives work within a negotiated division of rights."

 # Modifiers — The Divided House
 AUV_comital_house_compact_modifier:0 "Compact of the Comital House"
 AUV_comital_house_compact_modifier_desc:0 "The dynasty has committed itself to preserving a single comital settlement in Auvergne. Future events may still test that unity."
 AUV_divided_house_foundation_modifier:0 "Competing Auvergnat Claims"
 AUV_divided_house_foundation_modifier_desc:0 "The dynasty has formally recorded rival claims within the comital inheritance. This is the technical foundation for a future branch conflict, not yet a Dauphin title."

 # Modifiers — Saints and Patrons
 AUV_brioude_patron_modifier:0 "Patron of Saint-Julien of Brioude"
 AUV_brioude_patron_modifier_desc:0 "This ruler supports Brioude's aristocratic chapter and benefits from its prayers, prestige, and dynastic networks."
 AUV_brioude_cartulary_modifier:0 "Counsel of the Brioude Cartulary"
 AUV_brioude_cartulary_modifier_desc:0 "The chapter's documentary memory offers useful examples for ordering rights, gifts, and aristocratic obligations."
 AUV_chaise_dieu_patron_modifier:0 "Patron of La Chaise-Dieu"
 AUV_chaise_dieu_patron_modifier_desc:0 "This ruler supports the young reforming community founded by Robert of Turlande."
 AUV_chaise_dieu_expansion_modifier:0 "Supporting the Casadean Network"
 AUV_chaise_dieu_expansion_modifier_desc:0 "This ruler helps La Chaise-Dieu extend its network of dependencies and relationships beyond its first community."

 # Modifiers — Lords of the High Country
 AUV_upper_allier_routes_modifier:0 "Secured Upper Allier Routes"
 AUV_upper_allier_routes_modifier_desc:0 "Roads, crossings, and local fortifications have received sustained attention, making this difficult highland country easier to administer."
 AUV_upper_allier_tolls_modifier:0 "Enforced Upper Allier Tolls"
 AUV_upper_allier_tolls_modifier_desc:0 "Tolls and dues are collected more rigorously along the highland corridor, increasing revenue at the cost of local goodwill."
 AUV_upper_allier_compact_modifier:0 "Compact of the High Country"
 AUV_upper_allier_compact_modifier_desc:0 "Clerical mediation and recognition of local rights have secured cooperation along the Upper Allier."

 # Events — Counts and Crosiers
 auvergne.1000.t:0 "The Count and the Crosier"
 auvergne.1000.desc:0 "Representatives of the churches around Clermont arrive with charters, witnesses, and a long memory of privileges. My officers answer with claims of comital justice and the need for one hand to keep the peace. Neither side denies that order is needed; the dispute is over whose authority will provide it."
 auvergne.1000.a:0 "Confirm the Church's privileges."
 auvergne.1000.b:0 "Comital justice must prevail."
 auvergne.1000.c:0 "Set every right down in a common accord."
 auvergne.1000.info:0 "Historical context: the bishops of Clermont were major political actors, not merely spiritual advisers. Étienne II, drawn from the local aristocracy, participated in royal and regional politics and in the late tenth-century Peace of God milieu. The specific settlement in this event is representative gameplay fiction."
 auvergne.1001.t:0 "The Terms Are Tested"
 auvergne.1001.desc.privileges:0 "Years of cooperation with the churches have made their privileges part of the practical government of Clermont. My officers complain of revenues conceded, but local disputes now reach clerical mediators before they become open feuds."
 auvergne.1001.desc.jurisdiction:0 "My officers have made comital justice visible throughout the Clermont lands. Revenues arrive more reliably, but every enforcement of jurisdiction reminds the clergy that their older claims have not been forgotten."
 auvergne.1001.desc.compromise:0 "The compact has survived because neither side received everything it wanted. Comital officers and churchmen invoke the same written terms—usually with very different interpretations."
 auvergne.1001.a:0 "Authority is a practice, not a proclamation."

 # Events — Lords of the High Country
 auvergne.2000.t:0 "Roads Through the High Country"
 auvergne.2000.desc:0 "The routes along the upper Allier bind together valleys, crossings, fortified places, and lordships. Escorts and repairs would make passage reliable; firmer tolls would make the corridor pay; recognition of local rights might instead win the cooperation of castellans and communities."
 auvergne.2000.a:0 "Fund escorts, repairs, and reliable passage."
 auvergne.2000.b:0 "The crossings will pay their full dues."
 auvergne.2000.c:0 "Let the clergy mediate a compact of local rights."
 auvergne.2000.info:0 "Historical context: the area around Saugues belonged to a frontier network connected to the lordship of Mercœur. Archaeological and documentary evidence points to fortified sites and routes controlling access between the Velay, Gévaudan, Margeride, and neighboring Auvergnat highlands. The three policies are representative outcomes, not claims about one documented decree."

 # Events — Saints and Patrons
 auvergne.3000.t:0 "Saints and Patrons"
 auvergne.3000.desc:0 "A gift to a religious institution buys neither holiness nor obedience. It creates a relationship: prayers for my household, a place for aristocratic learning and memory, and an ally whose rights may one day collide with my own. Which community should receive sustained support?"
 auvergne.3000.a:0 "Stand behind Saint-Julien of Brioude."
 auvergne.3000.b:0 "Support the young house of La Chaise-Dieu."
 auvergne.3000.info:0 "Historical context: Saint-Julien of Brioude was a major aristocratic and canonical center with an exceptionally rich ninth- and tenth-century charter tradition. La Chaise-Dieu was founded by Robert of Turlande in 1043 and expanded rapidly within the eleventh-century reform movement. The particular offers here are representative patronage, not records of a specific donation."
 auvergne.3001.t:0 "The Memory of Brioude"
 auvergne.3001.desc:0 "The canons of Saint-Julien know that a benefactor expects more than gratitude. They can preserve my household in their prayers and commemorations, or open their treasury of charters to show how earlier counts and nobles ordered gifts, rights, and obligations."
 auvergne.3001.a:0 "Let my house be remembered in their prayers."
 auvergne.3001.b:0 "Bring out the charters; old precedents still have force."
 auvergne.3002.t:0 "A House Beginning to Spread"
 auvergne.3002.desc:0 "The community of La Chaise-Dieu is no longer merely a remote gathering around its founder. Brothers speak of new dependencies and relationships beyond the first house. My patronage could help that network grow, or remain focused on prayer and commemoration at the mother house."
 auvergne.3002.a:0 "Help the community establish wider ties."
 auvergne.3002.b:0 "Let my gift sustain prayer at the mother house."

 # Events — The Divided House
 auvergne.4000.t:0 "The Inheritance of Auvergne"
 auvergne.4000.desc:0 "The rights of our comital house are spoken of as one inheritance, but kin, marriages, and competing claims pull it in several directions. A compact might preserve one settlement. Recording rival claims would reduce immediate uncertainty, yet give future generations words with which to demand a division."
 auvergne.4000.a:0 "Bind the house to a single settlement."
 auvergne.4000.b:0 "Record the competing claims."
 auvergne.4000.info:0 "Historical context: in the twelfth century, the comital house divided between two Guillaumes. The elder line retained the comital title, while the younger line's descendants gradually adopted the Dauphin identity. The exact territorial partition and diplomatic chronology still require further research, so this foundation creates no title or predetermined branch."
 auvergne.4001.t:0 "Claims Set Down"
 auvergne.4001.desc:0 "The scribes have produced no clean partition, only a durable record that more than one line may claim a share of the Auvergnat inheritance. That ambiguity is dangerous—but it is also the material from which a new branch identity could one day be made."
 auvergne.4001.a:0 "Let future generations argue from these words."
